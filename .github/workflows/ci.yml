name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Unit tests
        run: bun run test:unit

      - name: Component tests
        run: bun run test:component

      - name: Lint
        run: bun x eslint --quiet app features components localization

  firebase:
    name: Firebase checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/firebase/functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install functions dependencies
        working-directory: apps/firebase/functions
        run: npm ci

      - name: Build functions
        working-directory: apps/firebase/functions
        run: npm run build

      - name: Unit tests
        working-directory: apps/firebase/functions
        run: npm test

      - name: Emulator tests
        working-directory: apps/firebase
        run: npx -y firebase-tools@14 emulators:exec --only auth,firestore,functions --project demo-housegains "cd functions && npm run test:emulator"

  admin:
    name: Admin checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
