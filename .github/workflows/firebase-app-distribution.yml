name: Firebase App Distribution

# Manual only: builds the signed dev variant (com.housegains.app.dev) and uploads it to
# Firebase App Distribution in the housegains-dev project.
#
# Needs the FIREBASE_SERVICE_ACCOUNT_JSON secret (a housegains-dev service account with the
# "Firebase App Distribution Admin" role). Optional repo variable FIREBASE_TESTER_GROUPS is a
# comma-separated list of App Distribution group aliases; when empty the release is uploaded
# without notifying anyone.
# iOS needs the tester devices registered in the Apple developer account (ad-hoc style export).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build and upload
        type: choice
        options:
          - both
          - android
          - ios
        default: both

concurrency:
  group: firebase-app-distribution
  cancel-in-progress: false

permissions:
  contents: read

env:
  FIREBASE_TOOLS_VERSION: 15.35.0
  FIREBASE_ANDROID_APP_ID: 1:988651433934:android:4144650996abfff83a459f
  FIREBASE_IOS_APP_ID: 1:988651433934:ios:1af966a3195281063a459f

jobs:
  android:
    name: Android dev APK
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      APP_VARIANT: dev
      EXPO_PUBLIC_GOOGLE_OAUTH_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Write upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDevRelease -PCI_VERSION_CODE=${{ github.run_number }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: housegains-dev-${{ github.run_number }}.apk
          path: apps/mobile/android/app/build/outputs/apk/dev/release/*.apk

      - name: Upload to Firebase App Distribution
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          set -euo pipefail
          [[ -n "$SERVICE_ACCOUNT_JSON" ]] || { echo "FIREBASE_SERVICE_ACCOUNT_JSON secret is missing." >&2; exit 1; }
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          args=(--app "$FIREBASE_ANDROID_APP_ID" --release-notes "Dev build ${{ github.run_number }} (${GITHUB_SHA::7})")
          [[ -z "$TESTER_GROUPS" ]] || args+=(--groups "$TESTER_GROUPS")
          apk=$(ls android/app/build/outputs/apk/dev/release/*.apk | head -n 1)
          npx --yes "firebase-tools@$FIREBASE_TOOLS_VERSION" appdistribution:distribute "$apk" "${args[@]}"

      - name: Remove keys
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/firebase-sa.json" android/keystore.properties

  ios:
    name: iOS dev IPA
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    env:
      APP_VARIANT: dev
      EXPO_PUBLIC_GOOGLE_OAUTH_IOS_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_WEB_CLIENT_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      TEAM_ID: L4N9Z3Z82V
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcode_app="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          [[ -n "$xcode_app" ]] || { echo "Xcode 26 is not installed on this runner." >&2; exit 1; }
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: apps/mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}

      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Write App Store Connect key
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          [[ -n "$ASC_KEY_CONTENT" && -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" ]] || { echo "App Store Connect secrets are missing." >&2; exit 1; }
          printf '%s\n' "$ASC_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF

      # Automatic signing with the API key lets Xcode create the profile for the registered devices.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -workspace ios/HouseGains.xcworkspace -scheme HouseGains \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/HouseGains.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER=com.housegains.app.dev FIREBASE_ENV=dev CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify archived build number
        run: |
          set -euo pipefail
          archived_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/HouseGains.xcarchive/Products/Applications/HouseGains.app/Info.plist")
          [[ "$archived_version" == "$GITHUB_RUN_NUMBER" ]] || { echo "Archived build number does not match this run." >&2; exit 1; }

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HouseGains.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log" | grep -E "error:|\*\* EXPORT" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" "$RUNNER_TEMP/export.log"

      - uses: actions/upload-artifact@v4
        with:
          name: housegains-dev-${{ github.run_number }}.ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to Firebase App Distribution
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          set -euo pipefail
          [[ -n "$SERVICE_ACCOUNT_JSON" ]] || { echo "FIREBASE_SERVICE_ACCOUNT_JSON secret is missing." >&2; exit 1; }
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          args=(--app "$FIREBASE_IOS_APP_ID" --release-notes "Dev build ${{ github.run_number }} (${GITHUB_SHA::7})")
          [[ -z "$TESTER_GROUPS" ]] || args+=(--groups "$TESTER_GROUPS")
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          npx --yes "firebase-tools@$FIREBASE_TOOLS_VERSION" appdistribution:distribute "$ipa" "${args[@]}"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-firebase-distribution-logs
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/export.log

      - name: Remove keys
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/firebase-sa.json"
